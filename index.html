<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEATH RACE // 999 VAULT</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1E1413">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="999 Vault">
    <link rel="apple-touch-icon" href="icon-180.png">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23010001' stroke='%23DAAF61' stroke-width='5'/><text x='50' y='65' font-family='sans-serif' font-size='40' font-weight='bold' fill='%23fff' text-anchor='middle'>999</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Oxanium:wght@400;600;800&family=Rajdhani:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

        window.firebaseImports = { initializeApp, getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, arrayUnion, arrayRemove };
    </script>

    <style>
        /* --- THEME VARIABLES (DEATH RACE // GRUNGE) --- */
        :root {
            /* Core Neutrals */
            --void: #010001;
            --hull: #1E1413;
            /* Oil Charcoal */
            --panel: #2A1E1D;
            /* Soot Brown */
            --divider: #413935;
            /* Ash Brown */

            /* Chrome & Metal */
            --chrome: #DBD5D3;
            /* Steel Silver */
            --chrome-dim: #C9C2C0;
            /* Cold Chrome */
            --text-dim: #A8A4A2;
            /* Gunmetal Gray */

            /* Accents */
            --nebula-purple: #563960;
            --deep-purple: #2E142E;
            --glow-purple: #855F8A;
            /* Soft Violet */
            --flame-amber: #DAAF61;
            /* Sparks */
            --rust-blaze: #BE5B45;
            /* Heat/Danger */

            --font-display: 'Orbitron', sans-serif;
            --font-ui: 'Oxanium', monospace;
            --font-body: 'Rajdhani', sans-serif;
        }

        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--rust-blaze) var(--hull);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--void);
            color: var(--chrome);
            font-family: var(--font-body);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- VISUALS --- */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 50% 120%, #2a1010 0%, var(--void) 70%);
            overflow: hidden;
        }

        .star-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: sparkle ease-in-out infinite;
        }

        @keyframes sparkle {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.2);
            }

            100% {
                opacity: 0;
                transform: scale(0.5);
            }
        }

        .grid-floor {
            position: absolute;
            bottom: -20%;
            left: -50%;
            width: 200%;
            height: 50%;
            background: linear-gradient(transparent 0%, var(--divider) 1px, transparent 2px), linear-gradient(90deg, transparent 0%, var(--divider) 1px, transparent 2px);
            background-size: 60px 60px;
            transform: perspective(300px) rotateX(70deg);
            opacity: 0.2;
            animation: gridMove 10s linear infinite;
        }

        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        @keyframes gridMove {
            0% {
                transform: perspective(300px) rotateX(70deg) translateY(0);
            }

            100% {
                transform: perspective(300px) rotateX(70deg) translateY(60px);
            }
        }

        /* --- UI COMPONENTS --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--hull);
            border-bottom: 2px solid var(--panel);
            width: 100%;
            z-index: 100;
            height: 60px;
            flex-shrink: 0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .app-title {
            font-family: var(--font-ui);
            font-style: italic;
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--chrome);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        .top-right-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .auth-btn {
            background: transparent;
            border: 1px solid var(--flame-amber);
            color: var(--flame-amber);
            padding: 5px 12px;
            font-family: var(--font-ui);
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            white-space: nowrap;
        }

        .auth-btn:hover {
            background: var(--flame-amber);
            color: #000;
        }

        .search-container {
            position: relative;
            width: 220px;
        }

        #searchInput {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--divider);
            color: var(--chrome);
            padding: 8px 12px;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            border-radius: 2px;
            outline: none;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        #searchInput::placeholder {
            color: var(--text-dim);
            opacity: 0.7;
        }

        #searchInput:focus {
            border-color: var(--flame-amber);
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 10px rgba(218, 175, 97, 0.2);
        }

        .search-results {
            position: absolute;
            top: 100%;
            right: 0;
            width: 300px;
            background: var(--hull);
            border: 1px solid var(--flame-amber);
            max-height: 300px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.9);
            z-index: 200;
            margin-top: 5px;
        }

        .search-results.active {
            display: block;
        }

        .search-item {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .search-item:hover {
            background: rgba(218, 175, 97, 0.1);
            color: var(--white);
        }

        .search-item-title {
            font-family: var(--font-body);
            font-size: 0.9rem;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
            text-transform: uppercase;
        }

        .module-deck {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px 20px 20px 20px;
            border-bottom: 2px solid var(--panel);
            background: rgba(1, 0, 1, 0.5);
        }

        .module-crate {
            flex-grow: 1;
            height: auto;
            background: var(--hull);
            display: flex;
            flex-direction: column;
            border-top: 2px solid var(--rust-blaze);
            overflow: hidden;
        }

        .reactor-container {
            width: 220px;
            height: 220px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .reactor-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed var(--divider);
            animation: spin 60s linear infinite;
        }

        .reactor-mid {
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 4px solid var(--panel);
            border-top-color: var(--rust-blaze);
            border-bottom-color: var(--glow-purple);
            box-shadow: 0 0 20px rgba(190, 91, 69, 0.1);
            animation: spin 4s linear infinite reverse;
        }

        .reactor-core {
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, var(--panel) 30%, #000 100%);
            border-radius: 50%;
            border: 1px solid var(--flame-amber);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 30px rgba(218, 175, 97, 0.2);
            z-index: 2;
        }

        .core-text {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--flame-amber);
            letter-spacing: -2px;
        }

        .reactor-container.paused .reactor-ring,
        .reactor-container.paused .reactor-mid {
            animation-play-state: paused;
        }

        .reactor-active .reactor-mid {
            animation-duration: 2s;
            box-shadow: 0 0 30px rgba(190, 91, 69, 0.4);
            border-top-color: var(--flame-amber);
        }

        .reactor-active .core-text {
            animation: pulseText 0.5s infinite alternate;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulseText {
            0% {
                text-shadow: 0 0 10px var(--flame-amber);
                opacity: 0.9;
            }

            100% {
                text-shadow: 0 0 25px var(--rust-blaze);
                opacity: 1;
            }
        }

        .player-top-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .track-display {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 500px;
            z-index: 5;
            flex-shrink: 0;
            cursor: pointer;
        }

        .song-title {
            font-family: var(--font-ui);
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: var(--chrome);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            font-family: var(--font-display);
            font-size: 0.7rem;
            background: var(--panel);
            border: 1px solid var(--divider);
            color: var(--flame-amber);
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(30, 20, 19, 0.8);
            padding: 15px 25px;
            border-radius: 4px;
            border: 1px solid var(--divider);
            backdrop-filter: blur(5px);
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .c-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .c-btn:hover {
            color: var(--flame-amber);
            text-shadow: 0 0 5px var(--flame-amber);
        }

        .c-btn.active {
            color: var(--rust-blaze);
            text-shadow: 0 0 10px var(--rust-blaze);
        }

        .play-btn {
            width: 60px;
            height: 60px;
            font-size: 1.6rem;
            border: 2px solid var(--chrome-dim);
            color: var(--chrome);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .play-btn:hover {
            border-color: var(--flame-amber);
            color: var(--flame-amber);
            box-shadow: 0 0 15px var(--flame-amber);
        }

        .like-main-btn.liked {
            color: var(--rust-blaze);
            animation: beat 0.3s;
        }

        .action-btn {
            color: var(--chrome);
        }

        .action-btn:hover {
            color: var(--flame-amber);
            text-shadow: 0 0 5px var(--flame-amber);
        }

        @keyframes beat {
            50% {
                transform: scale(1.3);
            }
        }

        .scrubber-contain {
            width: 100%;
            margin-top: 10px;
            flex-shrink: 0;
            position: relative;
            padding: 0 10px;
        }

        .scrub-bar {
            height: 8px;
            background: #111;
            border: 1px solid var(--divider);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .scrub-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--rust-blaze), var(--flame-amber));
            width: 0%;
            box-shadow: 0 0 15px var(--rust-blaze);
            position: relative;
            border-radius: 2px;
        }

        .duration-label {
            position: absolute;
            top: -30px;
            text-align: center;
            font-family: var(--font-ui);
            font-size: 0.9rem;
            color: var(--flame-amber);
            text-shadow: 0 0 5px var(--rust-blaze);
            opacity: 0;
            transition: opacity 0.1s ease;
            pointer-events: none;
            z-index: 10;
            transform: translateX(-50%);
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.9);
            padding: 2px 8px;
            border-radius: 3px;
            border: 1px solid var(--panel);
        }

        .scrubber-contain:hover .duration-label {
            opacity: 1;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-ui);
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 4px;
            padding: 0 5px;
        }

        .crate-header {
            display: flex;
            background: #000;
            flex-shrink: 0;
            border-bottom: 2px solid var(--panel);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .crate-header::-webkit-scrollbar {
            display: none;
        }

        .crate-tab {
            flex-shrink: 0;
            padding: 15px 25px;
            background: #0a0a0e;
            color: var(--text-dim);
            border: none;
            border-right: 1px solid var(--panel);
            font-family: var(--font-ui);
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            font-size: 1.2rem;
        }

        .crate-tab:hover {
            background: #15151a;
            color: #fff;
        }

        .crate-tab.active {
            background: var(--hull);
            color: var(--flame-amber);
            box-shadow: inset 0 -3px 0 var(--flame-amber);
        }

        .crate-tab-create {
            background: var(--panel);
            color: var(--chrome);
            border-right: none;
            border-left: 1px solid var(--panel);
            position: sticky;
            right: 0;
            z-index: 2;
        }

        .playlist-controls {
            background: var(--panel);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--divider);
            flex-shrink: 0;
        }

        .pl-info {
            font-family: var(--font-ui);
            color: var(--flame-amber);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .pl-actions-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pl-act-btn {
            border: none;
            padding: 8px 16px;
            font-family: var(--font-ui);
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            border-radius: 2px;
        }

        .pl-act-btn.play {
            background: var(--flame-amber);
            color: #000;
            box-shadow: 0 0 10px rgba(218, 175, 97, 0.4);
        }

        .pl-act-btn.play:hover {
            background: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        .pl-act-btn.shuffle {
            background: var(--rust-blaze);
            color: #fff;
            box-shadow: 0 0 10px rgba(190, 91, 69, 0.4);
        }

        .pl-act-btn.shuffle:hover {
            background: #ff4d4d;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
        }

        .pl-act-btn.delete {
            background: var(--panel);
            color: var(--text-dim);
            border: 1px solid var(--divider);
            box-shadow: none;
            font-size: 0.8rem;
            padding: 6px 12px;
        }

        .pl-act-btn.delete:hover {
            color: var(--rust-blaze);
            border-color: var(--rust-blaze);
        }

        .pl-edit-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .pl-edit-btn:hover {
            color: var(--chrome);
        }

        .pl-delete-btn:hover {
            color: var(--rust-blaze);
        }

        .track-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            -webkit-overflow-scrolling: touch;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-family: var(--font-body);
            color: #888;
            cursor: pointer;
            transition: 0.2s;
        }

        .track-item:hover {
            background: rgba(218, 175, 97, 0.05);
            color: #fff;
        }

        .track-item.playing {
            background: linear-gradient(90deg, rgba(190, 91, 69, 0.2), transparent);
            border-left: 4px solid var(--rust-blaze);
            color: var(--flame-amber);
        }

        .track-left {
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .track-index {
            color: var(--text-dim);
            font-family: var(--font-ui);
            font-size: 0.8rem;
            min-width: 25px;
        }

        .track-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.95rem;
        }

        .track-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .play-count {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .track-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .mini-btn {
            background: none;
            border: none;
            color: #555;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }

        .mini-btn:hover {
            color: var(--chrome);
        }

        .mini-heart.liked {
            color: var(--rust-blaze);
        }

        .mini-download:hover {
            color: var(--flame-amber);
        }

        .mini-add:hover {
            color: var(--glow-purple);
        }

        .mini-hide:hover {
            color: #888;
        }

        .mini-remove:hover {
            color: var(--rust-blaze);
        }

        .mini-edit:hover {
            color: var(--chrome);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--hull);
            border: 1px solid var(--rust-blaze);
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 50px rgba(190, 91, 69, 0.2);
            position: relative;
            max-width: 400px;
            width: 90%;
        }

        .modal-title {
            font-family: var(--font-display);
            margin: 0 0 20px 0;
            color: #fff;
            letter-spacing: 2px;
            font-size: 1.5rem;
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid var(--panel);
            color: #fff;
            font-family: var(--font-ui);
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--flame-amber);
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .icon-option {
            background: var(--panel);
            border: 1px solid transparent;
            color: var(--text-dim);
            padding: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-option:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .icon-option.selected {
            border-color: var(--flame-amber);
            color: var(--flame-amber);
        }

        .playlist-select-list {
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid var(--panel);
        }

        .playlist-option {
            padding: 10px;
            border-bottom: 1px solid var(--panel);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .playlist-option:hover {
            background: var(--panel);
        }

        .modal-btn {
            background: transparent;
            border: 1px solid var(--flame-amber);
            color: var(--flame-amber);
            padding: 10px 20px;
            font-family: var(--font-ui);
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            margin: 5px;
        }

        .modal-btn:hover {
            background: var(--flame-amber);
            color: #000;
        }

        .modal-btn.cancel {
            border-color: var(--text-dim);
            color: var(--text-dim);
        }

        .modal-btn.cancel:hover {
            background: var(--text-dim);
            color: #000;
        }

        .power-btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .power-btn {
            font-size: 8rem;
            color: var(--flame-amber);
            cursor: pointer;
            transition: all 0.4s ease;
            text-shadow: 0 0 20px var(--rust-blaze);
            animation: pulse-power 2s infinite alternate;
        }

        .power-btn:hover {
            transform: scale(1.1);
            color: #fff;
            text-shadow: 0 0 40px var(--flame-amber);
        }

        @keyframes pulse-power {
            from {
                text-shadow: 0 0 20px var(--rust-blaze);
                opacity: 0.8;
            }

            to {
                text-shadow: 0 0 40px var(--flame-amber);
                opacity: 1;
            }
        }

        @media (min-width: 601px) and (max-width: 1024px) {
            .reactor-container {
                width: 220px;
                height: 220px;
            }

            .song-title {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 600px) {
            .top-bar {
                padding: 10px 15px;
                height: 50px;
            }

            .app-title {
                font-size: 1.2rem;
            }

            .search-container {
                width: 140px;
            }

            #searchInput {
                padding: 5px 8px;
                font-size: 0.8rem;
            }

            .player-top-wrapper {
                flex-direction: row;
                justify-content: space-evenly;
                align-items: center;
                width: 100%;
                margin-bottom: 5px;
            }

            .module-deck {
                padding: 10px 5px 15px 5px;
                justify-content: flex-start;
                min-height: auto;
            }

            .reactor-container {
                width: 130px;
                height: 130px;
                margin-bottom: 0;
                flex-shrink: 0;
            }

            .core-text {
                font-size: 1.5rem;
            }

            .track-display {
                margin-bottom: 0;
                text-align: left;
                width: auto;
                max-width: 60%;
                padding-left: 10px;
            }

            .song-title {
                font-size: 1.1rem;
                white-space: normal;
                line-height: 1.2;
                max-height: 2.4em;
            }

            .control-panel {
                width: 100%;
                padding: 10px 5px;
                gap: 5px;
                justify-content: space-between;
                margin-bottom: 0;
            }

            .play-btn {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
            }

            .c-btn {
                width: 36px;
                height: 36px;
            }

            .scrubber-contain {
                margin-top: 15px;
                width: 100%;
                padding: 0 10px;
            }

            .scrub-bar {
                height: 12px;
            }

            .module-crate {
                height: 40vh;
            }

        @media (max-height: 600px) and (orientation: landscape) {

    <div class="starfield">
        <div class="grid-floor"></div>
    </div>
    <div class="star-layer" id="starLayer"></div>
    <div class="grain"></div>

    <div class="modal-overlay active" id="startModal" style="z-index: 3000;">
        <div class="modal-content" style="background: transparent; border: none; box-shadow: none;">
            <div class="power-btn-container">
                <i class="fas fa-power-off power-btn" onclick="igniteSystem()"></i>
            </div>
            <div style="margin-top: 20px; font-family: var(--font-ui); color: var(--flame-amber); letter-spacing: 2px;">
                IGNITE</div>
        </div>
    </div>

    <header class="top-bar">
        <div class="app-title">999 VAULT</div>
        <div class="top-right-group">
            <button id="authBtn" class="auth-btn" onclick="handleAuth()">LOGIN</button>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="SEARCH..." autocomplete="off">
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </header>

    <div class="modal-overlay" id="createPlaylistModal">
        <div class="modal-content">
            <div class="modal-title">NEW FREQUENCY</div>
            <input type="text" id="newPlaylistName" class="modal-input" placeholder="PLAYLIST NAME" maxlength="15">
            <div class="icon-grid" id="iconGrid"></div>
            <button class="modal-btn" onclick="confirmCreatePlaylist()">CREATE</button>
            <button class="modal-btn cancel" onclick="closeModals()">CANCEL</button>
        </div>
    </div>
    <div class="modal-overlay" id="addToPlaylistModal">
        <div class="modal-content">
            <div class="modal-title">SELECT FREQUENCY</div>
            <div class="playlist-select-list" id="playlistSelectList"></div>
            <button class="modal-btn cancel" onclick="closeModals()">CANCEL</button>
        </div>
    </div>

    <section class="module-deck">
        <div class="player-top-wrapper">
            <div class="reactor-container paused" id="reactor">
                <div class="reactor-ring"></div>
                <div class="reactor-mid"></div>
                <div class="reactor-core">
                    <div class="core-text">999</div>
                </div>
            </div>
            <div class="track-display" onclick="scrollToCurrentTrack()">
                <div class="song-title" id="mainTitle">SYSTEM READY</div>
                <div class="status-badge" id="statusBadge">IDLE</div>
            </div>
        </div>
        <div class="control-panel">
            <button class="c-btn" id="shuffleBtn" title="Shuffle Global"><i class="fas fa-random"></i></button>
            <button class="c-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
            <button class="c-btn play-btn" id="playBtn"><i class="fas fa-play"></i></button>
            <button class="c-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
            <button class="c-btn action-btn" id="mainAddBtn" title="Add to Playlist"
                onclick="openAddToPlaylistModal(event)"><i class="fas fa-plus"></i></button>
            <button class="c-btn action-btn" id="mainEditBtn" title="Rename Current" onclick="editCurrentSong(event)"><i
                    class="fas fa-pencil-alt"></i></button>
            <button class="c-btn action-btn" id="mainHideBtn" title="Hide Current" onclick="hideCurrentSong(event)"><i
                    class="fas fa-eye-slash"></i></button>
            <button class="c-btn like-main-btn" id="mainLikeBtn" title="Save to Crate"><i
                    class="far fa-heart"></i></button>
        </div>
        <div class="scrubber-contain" id="scrubberContain">
            <div class="duration-label" id="hoverDuration">0:00</div>
            <div class="scrub-bar" id="progressArea">
                <div class="scrub-fill" id="progressBar"></div>
            </div>
            <div class="time-stamps"><span id="currTime">0:00</span><span id="totTime" style="opacity: 0.5;">0:00</span>
            </div>
        </div>
    </section>

    <section class="module-crate">
        <div class="crate-header" id="crateHeader"></div>
        <div class="playlist-controls" id="playlistControls">
            <div class="pl-info-group"><span class="pl-info" id="currentPlaylistName">DATABASE</span><span
                    id="plEditControls"></span></div>
            <div class="pl-actions-group">
                <button class="pl-act-btn play" onclick="playCurrentView(false)"><i class="fas fa-play"></i>

                <button class="pl-act-btn shuffle" onclick="playCurrentView(true)"><i class="fas fa-random"></i>
                    SHUFFLE</button>
            </div>
        </div>
        <div class="track-list" id="playlistContainer"></div>
    </section>

        /* --- TITLE CLEANER HELPER --- */
        function cleanDisplayTitle(raw) {
            let title = raw.replace(/\.mp3$/i, '');
            title = title.replace(/Juice\s*WRLD\s*[-X,&]?\s*/gi, '');
            title = title.replace(/^[\s\-_]+|[\s\-_]+$/g, '').trim();
            if (!title) title = "Unknown Title";
            return title;
        }

        /* --- INIT --- */
        window.initApp = function () {
            createStars();

            // Build Song Database from Single Source
            const rawList = SONG_FILENAMES.map(f => ({ file: PATH_AUDIO + f, raw: f }));

            const seenTitles = new Set();
            const uniqueList = [];

            rawList.forEach(item => {
                const baseTitle = item.raw.replace('.mp3', '').replace(/_/g, ' ').trim();
                const normalizedTitle = baseTitle.toLowerCase();

                if (!seenTitles.has(normalizedTitle)) {
                    seenTitles.add(normalizedTitle);
                    const displayTitle = cleanDisplayTitle(baseTitle);
                    uniqueList.push({ ...item, cleanTitle: displayTitle, originalTitle: baseTitle });
                }
            });

            uniqueList.sort((a, b) => a.cleanTitle.localeCompare(b.cleanTitle));

            songs = uniqueList.map((item, i) => ({
                id: i,
                originalTitle: item.originalTitle,
                title: item.cleanTitle,
                file: item.file
            }));

            // Firebase Auth Listener
            window.auth.onAuthStateChanged(user => {
                currentUser = user;
                if (user) {
                    authBtn.innerText = "LOGOUT";
                    loadUserData();
                } else {
                    authBtn.innerText = "LOGIN";
                    window.auth.signInAnonymously().catch(e => console.error(e));
                }
            });

            // Populate Icon Grid
            const iconGrid = document.getElementById('iconGrid');
            PLAYLIST_ICONS.forEach(icon => {
                const div = document.createElement('div');
                div.className = 'icon-option';
                if (icon === selectedIcon) div.classList.add('selected');
                div.innerHTML = `<i class="fas ${icon}"></i>`;
                div.onclick = () => selectIcon(div, icon);
                iconGrid.appendChild(div);
            });
        }

        async function handleAuth() {
            if (currentUser && !currentUser.isAnonymous) {
                await window.signOut(window.auth);
                location.reload();
            } else {
                const provider = new window.GoogleAuthProvider();
                try {
                    await window.signInWithPopup(window.auth, provider);
                } catch (e) {
                    console.error("Auth Error", e);
                }
            }
        }

        /* --- FIREBASE DATA --- */
        async function loadUserData() {
            if (!currentUser) return;
            const docRef = window.doc(window.db, 'artifacts', window.appId, 'users', currentUser.uid, 'data', 'profile');

            window.onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    likedSongs = data.likedSongs || [];
                    hiddenSongs = data.hiddenSongs || [];
                    playCounts = data.playCounts || {};
                    playlists = data.playlists || [];
                    customTitles = data.customTitles || {};

                    songs.forEach(s => {
                        if (customTitles[s.originalTitle]) s.title = customTitles[s.originalTitle];
                    });

                    // Cache session for manual ignite
                    if (data.lastSession) cachedSession = data.lastSession;

                    renderPlaylistTabs();
                    updatePlaylistView();

                } else {
                    window.setDoc(docRef, { likedSongs: [], hiddenSongs: [], playCounts: {}, playlists: [], customTitles: {} });
                    cachedSession = null;
                }
            });
        }

        async function saveData(field, value) {
            if (!currentUser) return;
            const docRef = window.doc(window.db, 'artifacts', window.appId, 'users', currentUser.uid, 'data', 'profile');
            await window.updateDoc(docRef, { [field]: value });
        }

        async function saveSession() {
            if (!currentUser || !currentlyPlayingSong) return;
            const session = {
                songTitle: currentlyPlayingSong.originalTitle,
                time: audio.currentTime,
                tab: currentTab,
                isShuffle: isShuffle
            };
            const docRef = window.doc(window.db, 'artifacts', window.appId, 'users', currentUser.uid, 'data', 'profile');
            await window.updateDoc(docRef, { lastSession: session });
        }

        /* --- SYSTEM IGNITION --- */
        function igniteSystem() {
            startModal.classList.remove('active');

            if (cachedSession) {
                restoreSession(cachedSession);
            } else {
                startSystem();
            }
        }

        function restoreSession(session) {
            isShuffle = session.isShuffle;
            if (isShuffle) shuffleBtn.classList.add('active'); else shuffleBtn.classList.remove('active');

            if (session.tab) switchTab(session.tab);

            const song = songs.find(s => s.originalTitle === session.songTitle);
            if (song) {
                // Find index in current filtered list if possible
                const idx = currentPlaylist.findIndex(s => s.originalTitle === song.originalTitle);
                if (idx > -1) currentIndex = idx;

                loadSong(song, session.time || 0); // Pass start time
                playSong();
            } else {
                startSystem();
            }
        }

        function startSystem() {
            renderPlaylistTabs(); // Render the tabs first
            updatePlaylistView(); // Populate current Playlist first

            if (currentPlaylist.length > 0) {
                if (isShuffle) currentIndex = Math.floor(Math.random() * currentPlaylist.length);
                else currentIndex = 0;
                loadSong(currentPlaylist[currentIndex]);
                playSong();
            }
        }

        /* --- PLAYER LOGIC --- */
        function loadSong(song, startTime = 0) {
            if (!song) return;
            currentlyPlayingSong = song;
            currentSongPlayed = false;

            mainTitle.innerText = song.title;
            audio.src = song.file;
            audio.currentTime = startTime; // Set Time Immediately

            statusBadge.innerText = "BUFFERING...";
            statusBadge.style.color = "var(--flame-amber)";

            updateMainLikeBtn(song.originalTitle);
            highlightTrack(song.id);
            renderPlaylist();

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: 'Juice WRLD // 999',
                    artwork: [{ src: 'https://placehold.co/512/000000/FFF?text=999', sizes: '512x512', type: 'image/png' }]
                });
                navigator.mediaSession.setActionHandler('play', playSong);
                navigator.mediaSession.setActionHandler('pause', pauseSong);
                navigator.mediaSession.setActionHandler('previoustrack', prevSong);
                navigator.mediaSession.setActionHandler('nexttrack', nextSong);
            }
        }

        function playSong() {
            var playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    reactor.classList.add('reactor-active');
                    reactor.classList.remove('paused');
                    statusBadge.innerText = "PLAYING";
                    // Remove unlock listener if success
                    document.removeEventListener('click', unlockAudio);
                }).catch(error => {
                    console.log("Autoplay blocked");
                    statusBadge.innerText = "TAP TO RESUME";
                    // Add one-time unlock listener
                    document.addEventListener('click', unlockAudio, { once: true });
                });
            }
        }

        function unlockAudio() {
            audio.play().then(() => {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                reactor.classList.add('reactor-active');
                reactor.classList.remove('paused');
                statusBadge.innerText = "PLAYING";
            });
        }

        function pauseSong() {
            audio.pause();
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            reactor.classList.remove('reactor-active');
            reactor.classList.add('paused');
            statusBadge.innerText = "PAUSED";
            saveSession();
        }

        function togglePlay() {
            if (audio.paused) playSong(); else pauseSong();
        }

        function nextSong() {
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * currentPlaylist.length);
            } else {
                currentIndex++;
                if (currentIndex >= currentPlaylist.length) currentIndex = 0;
            }
            loadSong(currentPlaylist[currentIndex]);
            playSong();
        }

        function prevSong() {
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * currentPlaylist.length);
            } else {
                currentIndex--;
                if (currentIndex < 0) currentIndex = currentPlaylist.length - 1;
            }
            loadSong(currentPlaylist[currentIndex]);
            playSong();
        }

        /* --- VISUALS & TIMERS --- */
        function createStars() {
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const x = Math.random() * 100; const y = Math.random() * 100; const size = Math.random() * 3;
                star.style.left = `${x}%`; star.style.top = `${y}%`; star.style.width = `${size}px`; star.style.height = `${size}px`;
                star.style.animationDuration = `${2 + Math.random() * 4}s`; star.style.animationDelay = `${Math.random() * 5}s`;
                starLayer.appendChild(star);
            }
        }

        audio.addEventListener('timeupdate', (e) => {
            const cur = audio.currentTime;
            const dur = audio.duration;
            if (isNaN(dur)) return;
            progressBar.style.width = (cur / dur) * 100 + '%';
            currTimeEl.innerText = formatTime(cur);
            totTimeEl.innerText = formatTime(dur);

            // SMART PLAY COUNT: Only count if passed 50%
            if (dur > 0 && cur > dur / 2 && !currentSongPlayed) {
                incrementPlayCount(currentlyPlayingSong.originalTitle);
                currentSongPlayed = true;
            }

            if (Math.floor(cur) % 5 === 0) saveSession();
        });

        audio.addEventListener('ended', nextSong);

        const scrubber = document.getElementById('scrubberContain');
        scrubber.addEventListener('click', (e) => {
            const width = scrubber.clientWidth;
            const dur = audio.duration;
            if (dur) audio.currentTime = (e.offsetX / width) * dur;
        });
        scrubber.addEventListener('mousemove', (e) => {
            const width = scrubber.clientWidth;
            const dur = audio.duration;
            if (dur) {
                const time = (e.offsetX / width) * dur;
                hoverDuration.innerText = formatTime(time);
                hoverDuration.style.left = `${e.offsetX}px`;
            }
        });

        /* --- DATA MANAGEMENT --- */
        function incrementPlayCount(originalTitle) {
            playCounts[originalTitle] = (playCounts[originalTitle] || 0) + 1;
            saveData('playCounts', playCounts);
        }

        function toggleCurrentLike() {
            if (!currentlyPlayingSong) return;
            toggleLikeData(currentlyPlayingSong.originalTitle);
            updateMainLikeBtn(currentlyPlayingSong.originalTitle);
            renderPlaylist();
        }

        function toggleLikeList(e, song) {
            e.stopPropagation();
            toggleLikeData(song.originalTitle);
            if (currentlyPlayingSong && currentlyPlayingSong.originalTitle === song.originalTitle) {
                updateMainLikeBtn(song.originalTitle);
            }
            if (currentTab === 'saved') updatePlaylistView();
            else renderPlaylist();
        }

        function toggleLikeData(title) {
            if (likedSongs.includes(title)) likedSongs = likedSongs.filter(t => t !== title);
            else likedSongs.push(title);
            saveData('likedSongs', likedSongs);
        }

        function updateMainLikeBtn(title) {
            const isLiked = likedSongs.includes(title);
            mainLikeBtn.innerHTML = isLiked ? '<i class="fas fa-heart"></i>' : '<i class="far fa-heart"></i>';
            mainLikeBtn.classList.toggle('liked', isLiked);
        }

        function toggleHide(e, title) {
            if (e) e.stopPropagation();
            if (hiddenSongs.includes(title)) hiddenSongs = hiddenSongs.filter(t => t !== title);
            else hiddenSongs.push(title);
            saveData('hiddenSongs', hiddenSongs);
            updatePlaylistView();
        }

        function hideCurrentSong(e) {
            if (currentlyPlayingSong) toggleHide(e, currentlyPlayingSong.originalTitle);
        }

        function triggerDownload(e, id) {
            if (e) e.stopPropagation();
            const song = songs.find(s => s.id === id);
            if (!song) return;
            const a = document.createElement('a');
            a.href = `${PATH_AUDIO}${song.file}`;
            a.download = song.file;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        /* --- RENAMING --- */
        function editSongTitle(e, song) {
            if (e) e.stopPropagation();
            const newTitle = prompt("RENAME TRACK:", song.title);
            if (newTitle && newTitle.trim() !== "") {
                customTitles[song.originalTitle] = newTitle.trim();
                saveData('customTitles', customTitles);
                const s = songs.find(s => s.originalTitle === song.originalTitle);
                if (s) s.title = newTitle.trim();
                if (mainTitle.innerText === song.title) mainTitle.innerText = newTitle.trim();
                renderPlaylist();
            }
        }
        function editCurrentSong(e) { if (currentlyPlayingSong) editSongTitle(e, currentlyPlayingSong); }

        /* --- NAVIGATION & SEARCH --- */
        function switchTab(tab) {
            currentTab = tab;
            updateTabHighlight();
            updatePlaylistView();
            saveSession();
        }

        function updateTabHighlight() {
            document.querySelectorAll('.crate-tab').forEach(b => b.classList.remove('active'));
            if (currentTab === 'all') document.getElementById('tabAll').classList.add('active');
            else if (currentTab === 'saved') document.getElementById('tabSaved').classList.add('active');
            else if (currentTab === 'hidden') document.getElementById('tabHidden').classList.add('active');
            else {
                const el = document.getElementById(`tab_${currentTab}`);
                if (el) el.classList.add('active');
            }
        }

        function updatePlaylistView() {
            let label = "DATABASE";
            plEditControls.innerHTML = '';
            const actionsGroup = document.querySelector('.pl-actions-group');
            const existingDel = actionsGroup.querySelector('.pl-delete-main');
            if (existingDel) existingDel.remove();

            if (currentTab === 'all') {
                currentPlaylist = songs.filter(s => !hiddenSongs.includes(s.originalTitle));
                label = "DATABASE";
            } else if (currentTab === 'saved') {
                currentPlaylist = songs.filter(s => likedSongs.includes(s.originalTitle));
                label = "SAVED CRATE";
            } else if (currentTab === 'hidden') {
                currentPlaylist = songs.filter(s => hiddenSongs.includes(s.originalTitle));
                label = "ARCHIVED";
            } else {
                const pl = playlists.find(p => p.id === currentTab);
                if (pl) {
                    currentPlaylist = songs.filter(s => pl.songs.includes(s.originalTitle));
                    label = pl.name;
                    plEditControls.innerHTML = `<button class="pl-edit-btn" onclick="editPlaylistName()"><i class="fas fa-pencil-alt"></i></button>`;
                    const delBtn = document.createElement('button');
                    delBtn.className = 'pl-act-btn delete pl-delete-main';
                    delBtn.innerHTML = '<i class="fas fa-trash"></i> DELETE';
                    delBtn.onclick = deletePlaylist;
                    delBtn.style.fontSize = '0.8rem'; delBtn.style.padding = '5px 10px';
                    actionsGroup.appendChild(delBtn);
                } else {
                    currentPlaylist = [];
                }
            }
            currentPlaylistName.innerText = label;
            renderPlaylist();
        }

        function playCurrentView(shuffle) {
            if (currentPlaylist.length === 0) return alert("EMPTY VIEW");
            isShuffle = shuffle;
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * currentPlaylist.length);
                shuffleBtn.classList.add('active');
            } else {
                currentIndex = 0;
                shuffleBtn.classList.remove('active');
            }
            loadSong(currentPlaylist[currentIndex]);
            playSong();
        }

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            if (currentPlaylist.length === 0) { playlistContainer.innerHTML = '<div style="padding:20px; text-align:center; color:#555; font-family:var(--font-ui);">[ EMPTY SIGNAL ]</div>'; return; }

            const isCustomPlaylist = !['all', 'saved', 'hidden'].includes(currentTab);
            const html = currentPlaylist.map((song, idx) => {
                const isLiked = likedSongs.includes(song.originalTitle);
                const isActive = currentlyPlayingSong && currentlyPlayingSong.id === song.id;
                const playCount = playCounts[song.originalTitle] || 0;
                const isHiddenView = currentTab === 'hidden';
                const safeOrigTitle = song.originalTitle.replace(/'/g, "\\'");
                const safeFile = song.file.replace(/'/g, "\\'");

                let actionBtn4 = isCustomPlaylist ?
                    `<button class="mini-btn mini-remove" title="Remove" onclick="removeFromCurrentPlaylist(event, '${safeOrigTitle}')"><i class="fas fa-trash"></i></button>` :
                    `<button class="mini-btn mini-hide" onclick="toggleHide(event, '${safeOrigTitle}')"><i class="fas ${isHiddenView ? 'fa-eye' : 'fa-eye-slash'}"></i></button>`;

                return `
                <div class="track-item ${isActive ? 'playing' : ''}" id="track-${song.id}" onclick="playSpecific(${song.id})">
                    <div class="track-left"><span class="track-index">${idx + 1}</span><span class="track-name">${song.title}</span></div>
                    <div class="track-right">
                        <span class="play-count"><i class="fas fa-play" style="font-size:0.6rem;"></i> ${playCount}</span>
                        <div class="track-actions">
                            <button class="mini-btn mini-edit" onclick="editSongTitle(event, {title: '${song.title.replace(/'/g, "\\'")}', originalTitle: '${safeOrigTitle}'})"><i class="fas fa-pencil-alt"></i></button>
                            <button class="mini-btn mini-heart ${isLiked ? 'liked' : ''}" onclick="toggleLikeList(event, {originalTitle:'${safeOrigTitle}'})"><i class="fas fa-heart"></i></button>
                            <button class="mini-btn mini-add" onclick="openAddToPlaylistModal(event, '${safeOrigTitle}')"><i class="fas fa-plus"></i></button>
                            <button class="mini-btn mini-download" onclick="triggerDownload(event, ${song.id})"><i class="fas fa-download"></i></button>
                            ${actionBtn4}
                        </div>
                    </div>
                </div>`;
            }).join('');
            playlistContainer.innerHTML = html;
            if (currentlyPlayingSong) highlightTrack(currentlyPlayingSong.id);
        }

        window.playSpecific = function (id) {
            const realIndex = songs.findIndex(s => s.id === id);
            if (realIndex > -1) {
                const visIndex = currentPlaylist.findIndex(s => s.id === id);
                if (visIndex > -1) currentIndex = visIndex;
                loadSong(songs[realIndex]);
                playSong();
            }
        };

        function highlightTrack(id) {
            const el = document.getElementById(`track-${id}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function scrollToCurrentTrack() {
            if (!currentlyPlayingSong) return;
            const inList = currentPlaylist.find(s => s.id === currentlyPlayingSong.id);
            if (!inList) {
                switchTab('all');
                currentIndex = currentPlaylist.findIndex(s => s.id === currentlyPlayingSong.id);
            } else {
                currentIndex = currentPlaylist.findIndex(s => s.id === currentlyPlayingSong.id);
            }
            highlightTrack(currentlyPlayingSong.id);
        }

        /* --- SEARCH --- */
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            if (term.length < 1) { searchResults.classList.remove('active'); return; }
            const matches = songs.filter(s => s.title.toLowerCase().includes(term) && !hiddenSongs.includes(s.originalTitle));
            renderSearchResults(matches);
        });

        function renderSearchResults(matches) {
            searchResults.innerHTML = '';
            if (matches.length === 0) searchResults.innerHTML = '<div style="padding:10px; color:#555;">NO DATA FOUND</div>';
            else {
                matches.forEach(song => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerHTML = `<span class="search-item-title">${song.title}</span> <i class="fas fa-play" style="font-size:0.7rem; color:var(--flame-amber)"></i>`;
                    div.onclick = () => { jumpToSong(song.id); searchInput.value = ''; searchResults.classList.remove('active'); };
                    searchResults.appendChild(div);
                });
            }
            searchResults.classList.add('active');
        }

        function jumpToSong(id) {
            const realIndex = songs.findIndex(s => s.id === id);
            if (realIndex > -1) {
                const song = songs[realIndex];
                switchTab('all');
                currentIndex = currentPlaylist.findIndex(s => s.id === id);
                loadSong(song);
                playSong();
            }
        }

        /* --- PLAYLISTS --- */
        function openCreatePlaylistModal() { document.getElementById('createPlaylistModal').classList.add('active'); document.getElementById('newPlaylistName').value = ''; }
        function closeModals() { document.getElementById('createPlaylistModal').classList.remove('active'); document.getElementById('addToPlaylistModal').classList.remove('active'); }
        function selectIcon(el, icon) { selectedIcon = icon; document.querySelectorAll('.icon-option').forEach(e => e.classList.remove('selected')); el.classList.add('selected'); }
        function confirmCreatePlaylist() {
            const name = document.getElementById('newPlaylistName').value.trim();
            if (!name) return alert("NAME REQUIRED");
            const id = 'pl_' + Date.now();
            playlists.push({ id, name, icon: selectedIcon, songs: [] });
            saveData('playlists', playlists);
            closeModals();
            renderPlaylistTabs();
            switchTab(id);
        }
        function openAddToPlaylistModal(e, title) {
            if (e) e.stopPropagation();
            if (playlists.length === 0) return alert("CREATE A PLAYLIST FIRST (+)");
            if (typeof title === 'string') currentAddToSong = title;
            else if (currentlyPlayingSong) currentAddToSong = currentlyPlayingSong.originalTitle;
            if (!currentAddToSong) return;
            const list = document.getElementById('playlistSelectList');
            list.innerHTML = '';
            playlists.forEach(pl => {
                const div = document.createElement('div');
                div.className = 'playlist-option';
                div.innerHTML = `<i class="fas ${pl.icon}"></i> ${pl.name}`;
                div.onclick = () => addToPlaylist(pl.id, currentAddToSong);
                list.appendChild(div);
            });
            document.getElementById('addToPlaylistModal').classList.add('active');
        }
        function addToPlaylist(plId, title) {
            const pl = playlists.find(p => p.id === plId);
            if (pl && !pl.songs.includes(title)) {
                pl.songs.push(title);
                saveData('playlists', playlists);
                alert(`ADDED TO ${pl.name}`);
            } else if (pl) alert("ALREADY IN FREQUENCY");
            closeModals();
        }
        function editPlaylistName() {
            const pl = playlists.find(p => p.id === currentTab);
            if (!pl) return;
            const newName = prompt("RENAME PLAYLIST:", pl.name);
            if (newName && newName.trim() !== "") {
                pl.name = newName.trim();
                saveData('playlists', playlists);
                updatePlaylistView();
                renderPlaylistTabs();
            }
        }
        function deletePlaylist() {
            const pl = playlists.find(p => p.id === currentTab);
            if (!pl) return;
            if (confirm(`DELETE PLAYLIST "${pl.name}"?`)) {
                playlists = playlists.filter(p => p.id !== currentTab);
                saveData('playlists', playlists);
                renderPlaylistTabs();
                switchTab('all');
            }
        }
        function removeFromCurrentPlaylist(e, originalTitle) {
            if (e) e.stopPropagation();
            const pl = playlists.find(p => p.id === currentTab);
            if (!pl) return;
            pl.songs = pl.songs.filter(t => t !== originalTitle);
            saveData('playlists', playlists);
            updatePlaylistView();
        }
        function renderPlaylistTabs() {
            crateHeader.innerHTML = `<button class="crate-tab" id="tabAll" onclick="switchTab('all')" title="DATABASE"><i class="fas fa-save"></i></button><button class="crate-tab" id="tabSaved" onclick="switchTab('saved')" title="SAVED CRATE"><i class="fas fa-heart" style="color: var(--rust-blaze);"></i></button><button class="crate-tab" id="tabHidden" onclick="switchTab('hidden')" title="ARCHIVE"><i class="fas fa-eye-slash"></i></button>`;
            playlists.forEach(pl => {
                const btn = document.createElement('button');
                btn.className = 'crate-tab';
                btn.id = `tab_${pl.id}`;
                btn.innerHTML = `<i class="fas ${pl.icon}"></i>`;
                btn.title = pl.name;
                btn.onclick = () => switchTab(pl.id);
                crateHeader.appendChild(btn);
            });
            const createBtn = document.createElement('button');
            createBtn.className = 'crate-tab crate-tab-create';
            createBtn.innerHTML = '<i class="fas fa-plus"></i>';
            createBtn.onclick = openCreatePlaylistModal;
            crateHeader.appendChild(createBtn);
            updateTabHighlight();
        }

        function formatTime(s) { let m = Math.floor(s / 60); let sec = Math.floor(s % 60); if (sec < 10) sec = '0' + sec; return `${m}:${sec}`; }

        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextSong);
        prevBtn.addEventListener('click', prevSong);
        mainLikeBtn.addEventListener('click', toggleCurrentLike);
        shuffleBtn.addEventListener('click', () => { isShuffle = !isShuffle; shuffleBtn.classList.toggle('active'); saveSession(); });
        document.addEventListener('click', (e) => { if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) searchResults.classList.remove('active'); });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Registration failed: ', err));
            });
        }

        // Save session before page unload
        window.addEventListener('beforeunload', () => {
            if (currentUser && currentlyPlayingSong) {
                saveSession();
            }
        });
    </script>
</body>

</html>
